[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Fuji supports Shanghai; nothing here needs Cancun opcodes.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# The cross-language fixture generated by `npm run corpus` (packages/corpus, C2).
fs_permissions = [
  { access = "read", path = "../packages/corpus/data" },
  { access = "read", path = "deployments" },
]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
fuji = "https://api.avax-test.network/ext/bc/C/rpc"

# Snowtrace is served by Routescan. The URL follows Routescan's documented pattern for other
# testnets (".../network/testnet/evm/<chainId>/etherscan"); it is unconfirmed for Fuji until the
# first `--verify` run. The key is a fixed public placeholder that Routescan expects, not a secret.
[etherscan]
fuji = { key = "verifyContract", url = "https://api.routescan.io/v2/network/testnet/evm/43113/etherscan", chain = 43113 }
