[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Fuji supports Shanghai; nothing here needs Cancun opcodes.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# The cross-language fixture generated by `npm run corpus` (packages/corpus, C2).
fs_permissions = [{ access = "read", path = "../packages/corpus/data" }]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 64
fail_on_revert = false
